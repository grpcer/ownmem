name: release-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  # Only supersede pushes to a pull request. On main every commit is a release
  # candidate, so cancelling its run would leave the tagged commit ungated.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.gate }} (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
            gate: compatibility
          - os: ubuntu-latest
            node: 22
            gate: compatibility
          # The release benchmark is expensive and platform-independent, so one
          # lane carries the latency evidence for the whole matrix.
          - os: ubuntu-latest
            node: 24
            gate: release
          - os: macos-latest
            node: 24
            gate: compatibility
          - os: windows-latest
            node: 24
            gate: compatibility
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run full release gates
        if: matrix.gate == 'release'
        run: npm run verify:release
      - name: Run platform compatibility tests
        if: matrix.gate != 'release'
        run: npm test
      # Packing is platform-specific — the executable bit and the bin path have
      # regressed before — so every lane runs the pack gate, not only Linux.
      - name: Run pack gate
        if: matrix.gate != 'release'
        run: npm pack --dry-run --json
