<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 872" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
  <title id="title">Comment OwnMem transforme une question en contexte fiable</title>
  <desc id="description">Trois domaines de confiance : le dépôt contient du Markdown sélectionné qui passe des portes de gouvernance et se compile en snapshot immuable ; le moteur déterministe répond via six canaux candidats, un classement, une porte de confiance et une enveloppe de 400 tokens ; le coding agent interroge, vérifie contre le code actuel et écrit de nouvelles leçons qui reviennent par audit et compile.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#8b949e"/></marker>
    <marker id="accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff"/></marker>
  </defs>
  <rect x="0" y="0" width="1600" height="872" rx="18" fill="#0d1117"/>
  <text x="40" y="54" text-anchor="start" font-size="24" font-weight="700" fill="#f0f6fc">Comment OwnMem transforme une question en contexte fiable</text>
  <text x="40" y="80" text-anchor="start" font-size="13.5" font-weight="400" fill="#8b949e">Mémoire du dépôt · déterministe par défaut · les preuves avant la réponse</text>
  <rect x="1140" y="36" width="420" height="32" rx="16" fill="#0d2740" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="1350" y="57" text-anchor="middle" font-size="12.5" font-weight="600" fill="#58a6ff">Par défaut : 0 appel modèle · 0 appel réseau</text>
  <rect x="40" y="120" width="370" height="560" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
  <rect x="470" y="120" width="660" height="560" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <rect x="1190" y="120" width="370" height="560" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
  <rect x="60" y="106" width="129" height="28" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <text x="124.5" y="125" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1" fill="#f0f6fc">VOTRE DÉPÔT</text>
  <rect x="490" y="106" width="148" height="28" rx="14" fill="#0d2740" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="564" y="125" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1" fill="#58a6ff">MOTEUR OWNMEM</text>
  <rect x="1210" y="106" width="190" height="28" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <text x="1305" y="125" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1" fill="#f0f6fc">VOTRE CODING AGENT</text>
  <text x="60" y="154" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">Markdown brut · voyage avec git</text>
  <text x="490" y="154" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">déterministe · même question, même réponse</text>
  <text x="1210" y="154" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">le seul endroit où l'on juge</text>
  <rect x="60" y="170" width="330" height="92" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <text x="78" y="200" text-anchor="start" font-size="14" font-weight="650" fill="#f0f6fc">Sujets de mémoire sélectionnés</text>
  <text x="78" y="224" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">leçon · triggers · preuves</text>
  <text x="78" y="242" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">index L1 · zones L2 · sujets L3</text>
  <path d="M 225 262 L 225 286" fill="none" stroke="#8b949e" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="235" y="281" text-anchor="start" font-size="10.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#8b949e">ownmem audit</text>
  <rect x="60" y="292" width="330" height="92" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <text x="78" y="322" text-anchor="start" font-size="14" font-weight="650" fill="#f0f6fc">Portes de gouvernance</text>
  <text x="78" y="346" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">schema · limites de taille · quota</text>
  <text x="78" y="364" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">déduplication SimHash + MinHash</text>
  <path d="M 225 384 L 225 408" fill="none" stroke="#8b949e" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="235" y="403" text-anchor="start" font-size="10.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#8b949e">ownmem compile</text>
  <rect x="60" y="414" width="330" height="92" rx="12" fill="#102b1c" stroke="#3fb950" stroke-width="1.4"/>
  <text x="78" y="444" text-anchor="start" font-size="14" font-weight="650" fill="#f0f6fc">Snapshot immuable</text>
  <text x="78" y="468" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">postings · exact map · graph · ranking</text>
  <text x="78" y="486" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">repli sûr sur le précédent</text>
  <rect x="60" y="545" width="330" height="70" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="78" y="573" text-anchor="start" font-size="12.5" font-weight="600" fill="#f0f6fc">Relu comme du code</text>
  <text x="78" y="595" text-anchor="start" font-size="11" font-weight="400" fill="#8b949e">diff · pull request · rollback</text>
  <text x="440" y="448" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#8b949e">charge</text>
  <path d="M 394 460 L 466 460" fill="none" stroke="#8b949e" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="490" y="170" width="620" height="74" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <text x="510" y="200" text-anchor="start" font-size="14" font-weight="650" fill="#f0f6fc">Compréhension de la requête</text>
  <text x="510" y="226" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">intention classée · tokenizer par écriture · 40 langues</text>
  <path d="M 800 244 L 800 262" fill="none" stroke="#8b949e" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="490" y="268" width="620" height="118" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <text x="510" y="296" text-anchor="start" font-size="13.5" font-weight="650" fill="#f0f6fc">Six canaux candidats</text>
  <rect x="510" y="312" width="88" height="30" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
  <text x="554" y="331" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f0f6fc">Exact</text>
  <rect x="606" y="312" width="88" height="30" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
  <text x="650" y="331" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f0f6fc">BM25F</text>
  <rect x="702" y="312" width="88" height="30" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
  <text x="746" y="331" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f0f6fc">n-gram</text>
  <rect x="798" y="312" width="88" height="30" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
  <text x="842" y="331" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f0f6fc">Fuzzy</text>
  <rect x="894" y="312" width="88" height="30" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
  <text x="938" y="331" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f0f6fc">Graph</text>
  <rect x="990" y="312" width="88" height="30" rx="7" fill="#2d240f" stroke="#d29922" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="1034" y="331" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d29922">Embedding*</text>
  <text x="800" y="370" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8b949e">chaque canal classe ses candidats seul</text>
  <path d="M 800 386 L 800 404" fill="none" stroke="#8b949e" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="490" y="410" width="620" height="74" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <text x="510" y="440" text-anchor="start" font-size="14" font-weight="650" fill="#f0f6fc">Fusionner et juger</text>
  <text x="510" y="466" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">RRF · autorité · fraîcheur · preuves · conflits · MMR</text>
  <path d="M 800 484 L 800 500" fill="none" stroke="#8b949e" stroke-width="1.7" marker-end="url(#arrow)"/>
  <polygon points="800,506 872,558 800,610 728,558" fill="#2d240f" stroke="#d29922" stroke-width="1.5"/>
  <text x="800" y="563" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f0f6fc">Fiable ?</text>
  <rect x="500" y="518" width="200" height="80" rx="11" fill="#321d1c" stroke="#ff7b72" stroke-width="1.4"/>
  <text x="600" y="548" text-anchor="middle" font-size="13" font-weight="650" fill="#ff7b72">Non → s'abstenir</text>
  <text x="600" y="572" text-anchor="middle" font-size="11" font-weight="400" fill="#8b949e">ne rien injecter</text>
  <path d="M 724 558 L 706 558" fill="none" stroke="#8b949e" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="900" y="518" width="210" height="80" rx="11" fill="#102b1c" stroke="#3fb950" stroke-width="1.4"/>
  <text x="1005" y="542" text-anchor="middle" font-size="13" font-weight="650" fill="#3fb950">Oui → enveloppe</text>
  <text x="1005" y="558" text-anchor="middle" font-size="13" font-weight="650" fill="#3fb950">de contexte</text>
  <text x="1005" y="580" text-anchor="middle" font-size="11" font-weight="400" fill="#8b949e">≤400 tokens · 1 sujet</text>
  <path d="M 876 558 L 894 558" fill="none" stroke="#58a6ff" stroke-width="1.7" marker-end="url(#accent)"/>
  <path d="M 1110 558 L 1160 558 L 1160 338 L 1204 338" fill="none" stroke="#58a6ff" stroke-width="1.7" marker-end="url(#accent)"/>
  <rect x="1210" y="170" width="330" height="92" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <text x="1228" y="200" text-anchor="start" font-size="14" font-weight="650" fill="#f0f6fc">Interroge en langage courant</text>
  <text x="1228" y="224" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">un symptôme en mots ordinaires</text>
  <text x="1228" y="242" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">2–3 variantes, fusionnées par le moteur</text>
  <rect x="1210" y="292" width="330" height="92" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <text x="1228" y="322" text-anchor="start" font-size="14" font-weight="650" fill="#f0f6fc">Vérifie avant de se fier</text>
  <text x="1228" y="346" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">ouvre le sujet complet</text>
  <text x="1228" y="364" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">confronte au code actuel</text>
  <rect x="1210" y="414" width="330" height="64" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <text x="1228" y="440" text-anchor="start" font-size="12.5" font-weight="650" fill="#f0f6fc">correct · erroné · manqué</text>
  <text x="1228" y="462" text-anchor="start" font-size="11" font-weight="400" fill="#8b949e">le feedback local affine les triggers</text>
  <rect x="1210" y="508" width="330" height="92" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <text x="1228" y="538" text-anchor="start" font-size="14" font-weight="650" fill="#f0f6fc">Écrit de nouvelles leçons</text>
  <text x="1228" y="562" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">si aucun doc, porte ou test ne convient</text>
  <text x="1228" y="580" text-anchor="start" font-size="11.5" font-weight="400" fill="#8b949e">Markdown brut, relu en PR</text>
  <text x="1160" y="192" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#8b949e">ownmem</text>
  <text x="1160" y="205" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#8b949e">recall</text>
  <path d="M 1204 216 L 1136 216 " fill="none" stroke="#58a6ff" stroke-width="1.7" marker-end="url(#accent)"/>
  <path d="M 1375 600 L 1375 716 L 225 716 L 225 688" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="800" y="706" text-anchor="middle" font-size="11" font-weight="400" fill="#8b949e">nouvelle leçon ou feedback → audit → compile → prêt pour le prochain recall</text>
  <rect x="40" y="744" width="1520" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
  <text x="800" y="770" text-anchor="middle" font-size="14" font-weight="650" fill="#f0f6fc">Une mémoire pour tous les coding agents</text>
  <text x="800" y="792" text-anchor="middle" font-size="12" font-weight="400" fill="#8b949e">Claude Code · Codex · Gemini CLI · Cursor · Grok CLI</text>
  <text x="40" y="840" text-anchor="start" font-size="11" font-weight="400" fill="#8b949e">* L'embedding optionnel est isolé ; un échec conserve le lexical.</text>
</svg>
