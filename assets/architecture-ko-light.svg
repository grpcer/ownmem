<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 872" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
  <title id="title">OwnMem이 질문을 신뢰할 수 있는 컨텍스트로 바꾸는 과정</title>
  <desc id="description">세 가지 신뢰 도메인: 저장소는 선별된 Markdown을 보유하고 거버넌스 게이트를 거쳐 불변 snapshot으로 컴파일됩니다. 결정적 엔진은 6개 후보 channel, 랭킹, 확신도 게이트, 400 token envelope로 답합니다. coding agent는 질문하고 현재 code와 대조해 검증하며 새 교훈을 audit과 compile을 통해 되돌려 씁니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/></marker>
    <marker id="accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="1600" height="872" rx="18" fill="#ffffff"/>
  <text x="40" y="54" text-anchor="start" font-size="24" font-weight="700" fill="#0f172a">OwnMem이 질문을 신뢰할 수 있는 컨텍스트로 바꾸는 과정</text>
  <text x="40" y="80" text-anchor="start" font-size="13.5" font-weight="400" fill="#57606a">저장소 소유 · 기본은 결정적 · 답변 전에 증거 확인</text>
  <rect x="1140" y="36" width="420" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="1350" y="57" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2563eb">기본값: 모델 호출 0 · 네트워크 호출 0</text>
  <rect x="40" y="120" width="370" height="560" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <rect x="470" y="120" width="660" height="560" rx="16" fill="#f6f8fa" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="1190" y="120" width="370" height="560" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <rect x="60" y="106" width="69" height="28" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="94.5" y="125" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1" fill="#0f172a">저장소</text>
  <rect x="490" y="106" width="148" height="28" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="564" y="125" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1" fill="#2563eb">OWNMEM ENGINE</text>
  <rect x="1210" y="106" width="138" height="28" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="1279" y="125" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1" fill="#0f172a">CODING AGENT</text>
  <text x="60" y="154" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">플레인 Markdown · git과 함께 이동</text>
  <text x="490" y="154" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">결정적 · 같은 질문, 같은 답</text>
  <text x="1210" y="154" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">판단은 여기서만 일어남</text>
  <rect x="60" y="170" width="330" height="92" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="78" y="200" text-anchor="start" font-size="14" font-weight="650" fill="#0f172a">선별된 메모리 topic</text>
  <text x="78" y="224" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">교훈 · trigger · evidence</text>
  <text x="78" y="242" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">L1 색인 · L2 영역 · L3 topic</text>
  <path d="M 225 262 L 225 286" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="235" y="281" text-anchor="start" font-size="10.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#57606a">ownmem audit</text>
  <rect x="60" y="292" width="330" height="92" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="78" y="322" text-anchor="start" font-size="14" font-weight="650" fill="#0f172a">거버넌스 게이트</text>
  <text x="78" y="346" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">schema · 크기 상한 · 증가 quota</text>
  <text x="78" y="364" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">SimHash + MinHash 중복 제거</text>
  <path d="M 225 384 L 225 408" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="235" y="403" text-anchor="start" font-size="10.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#57606a">ownmem compile</text>
  <rect x="60" y="414" width="330" height="92" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
  <text x="78" y="444" text-anchor="start" font-size="14" font-weight="650" fill="#0f172a">불변 snapshot</text>
  <text x="78" y="468" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">postings · exact map · graph · ranking</text>
  <text x="78" y="486" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">이전 snapshot으로 안전하게 대체</text>
  <rect x="60" y="545" width="330" height="70" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="78" y="573" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">코드처럼 리뷰</text>
  <text x="78" y="595" text-anchor="start" font-size="11" font-weight="400" fill="#57606a">diff · pull request · 롤백</text>
  <text x="440" y="448" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#57606a">로드</text>
  <path d="M 394 460 L 466 460" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="490" y="170" width="620" height="74" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="510" y="200" text-anchor="start" font-size="14" font-weight="650" fill="#0f172a">쿼리 이해</text>
  <text x="510" y="226" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">의도 분류 · 문자 체계 인식 토크나이저 · 40개 언어</text>
  <path d="M 800 244 L 800 262" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="490" y="268" width="620" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="510" y="296" text-anchor="start" font-size="13.5" font-weight="650" fill="#0f172a">6개 후보 channel</text>
  <rect x="510" y="312" width="88" height="30" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="554" y="331" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Exact</text>
  <rect x="606" y="312" width="88" height="30" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="650" y="331" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">BM25F</text>
  <rect x="702" y="312" width="88" height="30" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="746" y="331" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">n-gram</text>
  <rect x="798" y="312" width="88" height="30" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="842" y="331" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Fuzzy</text>
  <rect x="894" y="312" width="88" height="30" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="938" y="331" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Graph</text>
  <rect x="990" y="312" width="88" height="30" rx="7" fill="#fffbeb" stroke="#a16207" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="1034" y="331" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a16207">Embedding*</text>
  <text x="800" y="370" text-anchor="middle" font-size="10.5" font-weight="400" fill="#57606a">각 channel이 독립적으로 후보를 순위화</text>
  <path d="M 800 386 L 800 404" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="490" y="410" width="620" height="74" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="510" y="440" text-anchor="start" font-size="14" font-weight="650" fill="#0f172a">통합 및 판정</text>
  <text x="510" y="466" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">RRF · authority · 최신성 · evidence · conflict · MMR</text>
  <path d="M 800 484 L 800 500" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <polygon points="800,506 872,558 800,610 728,558" fill="#fffbeb" stroke="#a16207" stroke-width="1.5"/>
  <text x="800" y="563" text-anchor="middle" font-size="12.5" font-weight="650" fill="#0f172a">확실한가?</text>
  <rect x="500" y="518" width="200" height="80" rx="11" fill="#fff1f0" stroke="#b42318" stroke-width="1.4"/>
  <text x="600" y="548" text-anchor="middle" font-size="13" font-weight="650" fill="#b42318">아니요 → abstain</text>
  <text x="600" y="572" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a">아무것도 주입하지 않음</text>
  <path d="M 724 558 L 706 558" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="900" y="518" width="210" height="80" rx="11" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
  <text x="1005" y="548" text-anchor="middle" font-size="13" font-weight="650" fill="#15803d">예 → context envelope</text>
  <text x="1005" y="574" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a">≤400 tokens · topic 1개</text>
  <path d="M 876 558 L 894 558" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#accent)"/>
  <path d="M 1110 558 L 1160 558 L 1160 338 L 1204 338" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#accent)"/>
  <rect x="1210" y="170" width="330" height="92" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="1228" y="200" text-anchor="start" font-size="14" font-weight="650" fill="#0f172a">일상 언어로 질문</text>
  <text x="1228" y="224" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">증상을 그대로 설명</text>
  <text x="1228" y="242" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">2–3개 표현을 엔진이 융합</text>
  <rect x="1210" y="292" width="330" height="92" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="1228" y="322" text-anchor="start" font-size="14" font-weight="650" fill="#0f172a">신뢰 전에 검증</text>
  <text x="1228" y="346" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">topic 전문을 열어</text>
  <text x="1228" y="364" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">현재 code와 대조</text>
  <rect x="1210" y="414" width="330" height="64" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="1228" y="440" text-anchor="start" font-size="12.5" font-weight="650" fill="#0f172a">correct · wrong · miss</text>
  <text x="1228" y="462" text-anchor="start" font-size="11" font-weight="400" fill="#57606a">로컬 feedback이 trigger를 개선</text>
  <rect x="1210" y="508" width="330" height="92" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="1228" y="538" text-anchor="start" font-size="14" font-weight="650" fill="#0f172a">새 교훈 기록</text>
  <text x="1228" y="562" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">doc · 게이트 · 테스트로 안 될 때만</text>
  <text x="1228" y="580" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">플레인 Markdown, PR에서 리뷰</text>
  <text x="1160" y="192" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#57606a">ownmem</text>
  <text x="1160" y="205" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#57606a">recall</text>
  <path d="M 1204 216 L 1136 216 " fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#accent)"/>
  <path d="M 1375 600 L 1375 716 L 225 716 L 225 688" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="800" y="706" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a">새 교훈 / feedback → audit → compile → 다음 recall 준비</text>
  <rect x="40" y="744" width="1520" height="64" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="800" y="770" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">하나의 메모리, 모든 coding agent</text>
  <text x="800" y="792" text-anchor="middle" font-size="12" font-weight="400" fill="#57606a">Claude Code · Codex · Gemini CLI · Cursor · Grok CLI</text>
  <text x="40" y="840" text-anchor="start" font-size="11" font-weight="400" fill="#57606a">* 선택적 embedding은 격리되며 실패해도 어휘 결과 유지.</text>
</svg>
