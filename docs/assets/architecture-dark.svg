  <rect x="724" y="420" width="218" height="42" rx="11" fill="#60a5fa"/>
  <text x="833" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Immutable snapshot</text>
  <text x="526" y="490" text-anchor="start" font-size="14" font-weight="700" fill="#f8fafc">Candidate recall</text>
  <rect x="526" y="506" width="104" height="36" rx="9" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="578" y="529" text-anchor="middle" font-size="11.5" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f8fafc">exact</text>
  <rect x="642" y="506" width="104" height="36" rx="9" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="694" y="529" text-anchor="middle" font-size="11.5" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f8fafc">BM25F</text>
  <rect x="758" y="506" width="104" height="36" rx="9" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="810" y="529" text-anchor="middle" font-size="11.5" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f8fafc">n-gram</text>
  <rect x="874" y="506" width="104" height="36" rx="9" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="926" y="529" text-anchor="middle" font-size="11.5" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f8fafc">fuzzy</text>
  <rect x="990" y="506" width="104" height="36" rx="9" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="1042" y="529" text-anchor="middle" font-size="11.5" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f8fafc">graph</text>
  <rect x="526" y="552" width="568" height="36" rx="9" fill="#172554" stroke="#60a5fa" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="810" y="575" text-anchor="middle" font-size="11.5" font-weight="600" fill="#60a5fa">Optional embedding: observe / weight 0 until local A/B passes</text>
  <rect x="526" y="606" width="274" height="62" rx="11" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="542" y="631" text-anchor="start" font-size="13.5" font-weight="700" fill="#f8fafc">Fuse + rank</text>
  <text x="542" y="653" text-anchor="start" font-size="11.5" font-weight="400" fill="#a8b3c7">deterministic · dedupe · bounded</text>
  <path d="M 800 637 L 830 637" fill="none" stroke="#a8b3c7" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="846" y="606" width="294" height="62" rx="11" fill="#352114" stroke="#fdba74" stroke-width="1.4"/>
