<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Arial, sans-serif">
  <title id="title">OwnMem architecture</title>
  <desc id="description">Repository-owned Markdown and independent trust receipts compile into immutable snapshots. Five deterministic local candidate lanes and an optional embedding lane pass four delivery gates. An end-of-turn coordinator replays, promotes, observes, quarantines, and precisely rolls back low-risk R0 changes while higher-risk changes remain review material.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#a8b3c7"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa"/></marker>
  </defs>
  <rect x="0" y="0" width="1600" height="980" rx="28" fill="#0b1020"/>
  <text x="52" y="58" text-anchor="start" font-size="27" font-weight="750" fill="#f8fafc">OwnMem architecture</text>
  <text x="52" y="88" text-anchor="start" font-size="14" font-weight="500" fill="#a8b3c7">Repository-owned · local recall · evidence governance · bounded autonomy</text>
  <rect x="1130" y="34" width="418" height="44" rx="22" fill="#172554" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="1339" y="62" text-anchor="middle" font-size="13" font-weight="650" fill="#60a5fa">Default recall: 0 model calls · 0 network calls</text>
  <rect x="52" y="120" width="1496" height="108" rx="18" fill="#111827" stroke="#334155" stroke-width="1.4"/>
  <text x="78" y="150" text-anchor="start" font-size="12" font-weight="750" fill="#a8b3c7">HOST LAYER</text>
  <rect x="78" y="168" width="160" height="38" rx="10" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="158" y="192" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f8fafc">Claude Code</text>
  <rect x="250" y="168" width="136" height="38" rx="10" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="318" y="192" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f8fafc">Codex</text>
  <rect x="402" y="168" width="136" height="38" rx="10" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="470" y="192" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f8fafc">Cursor</text>
  <rect x="554" y="168" width="160" height="38" rx="10" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="634" y="192" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f8fafc">Gemini CLI</text>
  <rect x="730" y="168" width="170" height="38" rx="10" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="815" y="192" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f8fafc">Other Agents</text>
  <path d="M 916 187 L 962 187" fill="none" stroke="#a8b3c7" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="982" y="150" width="536" height="64" rx="13" fill="#172554" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="1250" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#60a5fa">Unified project entry</text>
  <text x="1250" y="199" text-anchor="middle" font-size="11.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#a8b3c7">instructions · skills · commands · hook</text>
  <path d="M 800 228 L 800 258" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="52" y="274" width="420" height="420" rx="18" fill="#111827" stroke="#334155" stroke-width="1.4"/>
  <text x="78" y="306" text-anchor="start" font-size="12" font-weight="750" fill="#a8b3c7">01 · REPOSITORY SOURCE OF TRUTH</text>
  <text x="78" y="342" text-anchor="start" font-size="22" font-weight="750" fill="#f8fafc">.ownmem/</text>
  <text x="78" y="367" text-anchor="start" font-size="12.5" font-weight="400" fill="#a8b3c7">Human-readable · Git-reviewable · reversible</text>
  <rect x="78" y="394" width="368" height="62" rx="11" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="94" y="419" text-anchor="start" font-size="13.5" font-weight="700" fill="#f8fafc">L1 · MEMORY.md</text>
  <text x="94" y="441" text-anchor="start" font-size="11.5" font-weight="400" fill="#a8b3c7">routing index · always-small contract</text>
  <rect x="78" y="468" width="368" height="62" rx="11" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="94" y="493" text-anchor="start" font-size="13.5" font-weight="700" fill="#f8fafc">L2 · MEMORY-&lt;area&gt;.md</text>
  <text x="94" y="515" text-anchor="start" font-size="11.5" font-weight="400" fill="#a8b3c7">area index · scoped loading</text>
  <rect x="78" y="542" width="368" height="62" rx="11" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="94" y="567" text-anchor="start" font-size="13.5" font-weight="700" fill="#f8fafc">L3 · topic.md</text>
  <text x="94" y="589" text-anchor="start" font-size="11.5" font-weight="400" fill="#a8b3c7">one lesson · triggers · evidence</text>
  <rect x="78" y="620" width="178" height="62" rx="11" fill="#352114" stroke="#fdba74" stroke-width="1.4"/>
  <text x="94" y="645" text-anchor="start" font-size="13.5" font-weight="700" fill="#fdba74">Trust receipt</text>
  <text x="94" y="667" text-anchor="start" font-size="11.5" font-weight="400" fill="#a8b3c7">content hash · evidence · lifecycle</text>
  <rect x="268" y="620" width="178" height="62" rx="11" fill="#132a22" stroke="#86efac" stroke-width="1.4"/>
  <text x="284" y="645" text-anchor="start" font-size="13.5" font-weight="700" fill="#86efac">Audit gates</text>
  <text x="284" y="667" text-anchor="start" font-size="11.5" font-weight="400" fill="#a8b3c7">quota · dedupe · schema</text>
  <rect x="500" y="274" width="666" height="420" rx="18" fill="#111827" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="526" y="306" text-anchor="start" font-size="12" font-weight="750" fill="#60a5fa">02 · CANONICAL RUNTIME</text>
  <rect x="526" y="330" width="614" height="62" rx="11" fill="#172554" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="542" y="355" text-anchor="start" font-size="13.5" font-weight="700" fill="#60a5fa">Compile</text>
  <text x="542" y="377" text-anchor="start" font-size="11.5" font-weight="400" fill="#a8b3c7">schema · graph · receipts · live evidence</text>
