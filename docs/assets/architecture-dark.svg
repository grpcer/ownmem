  <rect x="990" y="792" width="532" height="96" rx="13" fill="#172554" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="1256" y="824" text-anchor="middle" font-size="14" font-weight="750" fill="#60a5fa">R0 auto-write · R1–R5 review</text>
  <text x="1256" y="851" text-anchor="middle" font-size="11.5" font-weight="500" fill="#a8b3c7">failures quarantine and restore exact previous bytes</text>
