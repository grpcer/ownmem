  <text x="862" y="653" text-anchor="start" font-size="11.5" font-weight="400" fill="#a8b3c7">relevance · validity · applicability · risk</text>
  <rect x="1194" y="274" width="354" height="420" rx="18" fill="#111827" stroke="#334155" stroke-width="1.4"/>
  <text x="1220" y="306" text-anchor="start" font-size="12" font-weight="750" fill="#a8b3c7">03 · TRUSTED DELIVERY</text>
  <rect x="1220" y="336" width="302" height="62" rx="11" fill="#172554" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="1236" y="361" text-anchor="start" font-size="13.5" font-weight="700" fill="#60a5fa">Context envelope</text>
  <text x="1236" y="383" text-anchor="start" font-size="11.5" font-weight="400" fill="#a8b3c7">≤1 topic · 400 tokens · provenance</text>
  <path d="M 1166 486 L 1194 486" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="1220" y="430" width="302" height="62" rx="11" fill="#172033" stroke="#334155" stroke-width="1.4"/>
