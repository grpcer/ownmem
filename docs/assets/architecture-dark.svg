  <text x="1236" y="477" text-anchor="start" font-size="11.5" font-weight="400" fill="#a8b3c7">verify against current code and docs</text>
  <rect x="1220" y="524" width="302" height="62" rx="11" fill="#132a22" stroke="#86efac" stroke-width="1.4"/>
  <text x="1236" y="549" text-anchor="start" font-size="13.5" font-weight="700" fill="#86efac">Honest observability</text>
  <text x="1236" y="571" text-anchor="start" font-size="11.5" font-weight="400" fill="#a8b3c7">confirmed adoption is a separate outcome</text>
  <text x="1371" y="626" text-anchor="middle" font-size="11.5" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#a8b3c7">completed → delivered → consumed</text>
  <rect x="52" y="736" width="1496" height="188" rx="18" fill="#060b16"/>
  <text x="78" y="770" text-anchor="start" font-size="12" font-weight="750" fill="#60a5fa">04 · LOCAL FEEDBACK AND BOUNDED EVOLUTION</text>
  <rect x="78" y="792" width="274" height="96" rx="13" fill="#111827" stroke="#334155" stroke-width="1.4"/>
  <text x="215" y="824" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f8fafc">Three ledgers</text>
  <text x="215" y="851" text-anchor="middle" font-size="11.2" font-weight="400" fill="#cbd5e1">retrieval · confirmed outcome · self-attribution</text>
  <rect x="382" y="792" width="274" height="96" rx="13" fill="#111827" stroke="#334155" stroke-width="1.4"/>
  <text x="519" y="824" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f8fafc">Candidate queue</text>
  <text x="519" y="851" text-anchor="middle" font-size="11.2" font-weight="400" fill="#cbd5e1">candidate ≠ memory · quarantine by default</text>
  <rect x="686" y="792" width="274" height="96" rx="13" fill="#111827" stroke="#334155" stroke-width="1.4"/>
  <text x="823" y="824" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f8fafc">Risk + observation</text>
  <text x="823" y="851" text-anchor="middle" font-size="11.2" font-weight="400" fill="#cbd5e1">replay · regression · quota · tripwire</text>
