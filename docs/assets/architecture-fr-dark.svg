  <text x="94" y="515" text-anchor="start" font-size="11.5" font-weight="400" fill="#a8b3c7">area index · scoped loading</text>
  <rect x="78" y="542" width="368" height="62" rx="11" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="94" y="567" text-anchor="start" font-size="13.5" font-weight="700" fill="#f8fafc">L3 · topic.md</text>
