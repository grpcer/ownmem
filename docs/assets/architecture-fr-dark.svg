  <rect x="52" y="120" width="1496" height="108" rx="18" fill="#111827" stroke="#334155" stroke-width="1.4"/>
  <text x="78" y="150" text-anchor="start" font-size="12" font-weight="750" fill="#a8b3c7">COUCHE HOST</text>
  <rect x="78" y="168" width="160" height="38" rx="10" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="158" y="192" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f8fafc">Claude Code</text>
  <rect x="250" y="168" width="136" height="38" rx="10" fill="#172033" stroke="#334155" stroke-width="1.4"/>
  <text x="318" y="192" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f8fafc">Codex</text>
  <rect x="402" y="168" width="136" height="38" rx="10" fill="#172033" stroke="#334155" stroke-width="1.4"/>
