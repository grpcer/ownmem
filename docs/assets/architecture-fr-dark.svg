  <rect x="268" y="620" width="178" height="62" rx="11" fill="#132a22" stroke="#86efac" stroke-width="1.4"/>
  <text x="284" y="645" text-anchor="start" font-size="13.5" font-weight="700" fill="#86efac">Audit gates</text>
