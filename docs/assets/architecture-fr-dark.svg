  <text x="78" y="306" text-anchor="start" font-size="12" font-weight="750" fill="#a8b3c7">01 · SOURCE DU DÉPÔT</text>
  <text x="78" y="342" text-anchor="start" font-size="22" font-weight="750" fill="#f8fafc">.ownmem/</text>
  <text x="78" y="367" text-anchor="start" font-size="12.5" font-weight="400" fill="#a8b3c7">Lisible · révisable dans Git · réversible</text>
  <rect x="78" y="394" width="368" height="62" rx="11" fill="#172033" stroke="#334155" stroke-width="1.4"/>
