<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Arial, sans-serif">
  <title id="title">Architecture OwnMem</title>
  <desc id="description">Le Markdown détenu par le dépôt et des trust receipts indépendants sont compilés en snapshots immuables. Cinq canaux locaux déterministes et un embedding optionnel passent quatre portes de livraison. En fin de tour, un coordinateur rejoue, promeut, observe, isole et annule précisément les changements R0 à faible risque ; les autres restent à relire.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#a8b3c7"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa"/></marker>
  </defs>
  <rect x="0" y="0" width="1600" height="980" rx="28" fill="#0b1020"/>
  <text x="52" y="58" text-anchor="start" font-size="27" font-weight="750" fill="#f8fafc">Architecture OwnMem</text>
  <text x="52" y="88" text-anchor="start" font-size="14" font-weight="500" fill="#a8b3c7">Mémoire du dépôt · rappel local · preuves · autonomie bornée</text>
