<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Arial, sans-serif">
  <title id="title">Arquitetura do OwnMem</title>
  <desc id="description">Markdown pertencente ao repositório e trust receipts independentes são compilados em snapshots imutáveis. Cinco canais locais determinísticos e embedding opcional passam por quatro portões de entrega. No fim do turno, um coordenador reproduz, promove, observa, isola e reverte com precisão mudanças R0 de baixo risco; riscos maiores ficam para revisão.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#526176"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/></marker>
  </defs>
