  <rect x="1220" y="524" width="302" height="62" rx="11" fill="#f0fdf4" stroke="#166534" stroke-width="1.4"/>
  <text x="1236" y="549" text-anchor="start" font-size="13.5" font-weight="700" fill="#166534">Honest observability</text>
  <text x="1236" y="571" text-anchor="start" font-size="11.5" font-weight="400" fill="#526176">adoção confirmada é um outcome separado</text>
