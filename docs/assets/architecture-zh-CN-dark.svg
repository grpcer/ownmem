  <text x="1236" y="477" text-anchor="start" font-size="11.5" font-weight="400" fill="#a8b3c7">再对照当前代码和文档复核</text>
  <rect x="1220" y="524" width="302" height="62" rx="11" fill="#132a22" stroke="#86efac" stroke-width="1.4"/>
  <text x="1236" y="549" text-anchor="start" font-size="13.5" font-weight="700" fill="#86efac">Honest observability</text>
  <text x="1236" y="571" text-anchor="start" font-size="11.5" font-weight="400" fill="#a8b3c7">真实采用只认独立 outcome</text>
  <text x="1371" y="626" text-anchor="middle" font-size="11.5" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#a8b3c7">completed → delivered → consumed</text>
  <rect x="52" y="736" width="1496" height="188" rx="18" fill="#060b16"/>
  <text x="78" y="770" text-anchor="start" font-size="12" font-weight="750" fill="#60a5fa">04 · 本地反馈与有界演化</text>
