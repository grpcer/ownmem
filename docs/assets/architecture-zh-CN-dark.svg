  <text x="1256" y="851" text-anchor="middle" font-size="11.5" font-weight="500" fill="#a8b3c7">失败先隔离，再精确恢复原字节</text>
  <text x="1256" y="874" text-anchor="middle" font-size="10.8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#a8b3c7">trust → audit → compile → tripwire → rollback receipt</text>
