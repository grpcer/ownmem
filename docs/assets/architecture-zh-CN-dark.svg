  <text x="78" y="306" text-anchor="start" font-size="12" font-weight="750" fill="#a8b3c7">01 · 仓库真源</text>
  <text x="78" y="342" text-anchor="start" font-size="22" font-weight="750" fill="#f8fafc">.ownmem/</text>
